name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install -r requirements-dev.txt

      - run: pytest

      - name: Build Docker image
        run: docker build -t financedashboardacr.azurecr.io/finance-dashboard:${{ github.sha }} .

      - name: Azure login
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/login@v2
        with:
            client-id: ${{ secrets.AZURE_CLIENT_ID }}
            tenant-id: ${{ secrets.AZURE_TENANT_ID }}
            subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: az acr login --name financedashboardacr

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push financedashboardacr.azurecr.io/finance-dashboard:${{ github.sha }}

      - name: Deploy container app
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          az containerapp update \
            --name finance-dashboard \
            --resource-group finance-dashboard-rg \
            --image financedashboardacr.azurecr.io/finance-dashboard:${{ github.sha }} \
            --set-env-vars \
              AUTH0_CLIENT_ID=secretref:auth0-client-id \
              AUTH0_CLIENT_SECRET=secretref:auth0-client-secret \
              STREAMLIT_COOKIE_SECRET=secretref:streamlit-cookie-secret \
              AUTH0_ALLOWED_SUB=secretref:auth0-allowed-sub
